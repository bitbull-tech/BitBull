# Development override: build the images from this checkout instead of pulling the published
# ones. The image NAMES stay the same as in docker-compose.yml, so a locally built image simply
# takes the place of the registry one and `docker compose up -d` (no --build) keeps using it.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# or set COMPOSE_FILE once, which is what the Windows scripts do:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.dev.yml
#
# Users installing BitBull never need this file: they pull. See docs/CLIENTS.md "Phase 5".

services:
  bitbull-agent:
    build: .
  egress:
    build: ./egress
  gateway:
    build: ./egress
