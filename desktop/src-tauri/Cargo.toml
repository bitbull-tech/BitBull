[package]
name = "bitbull-desktop"
version = "0.1.0"
description = "BitBull desktop: manages the local sandboxed stack and shows the BitBull UI (Windows and macOS)"
edition = "2021"
rust-version = "1.77"

[lib]
name = "bitbull_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The Mac link helper keeps the vault key in the login Keychain (src/helper.rs)
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
