[package]
name = "gm-desktop"
version = "0.1.0"
description = "GM Agent desktop: manages the local sandboxed stack and shows the GM UI"
edition = "2021"
rust-version = "1.77"

[lib]
name = "gm_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
