# BitBob in a sandbox.
#   docker compose up -d             → pulls the published images, UI + API on http://localhost:8787
#   docker compose logs -f bitbob-agent  → server output (also in data/logs/server.log)
#   docker compose logs -f egress    → every outbound request, allowed or refused
#
# This file PULLS the images that CI publishes; nothing is built on the machine that runs it.
# To build from this checkout instead (the development path), add the dev override:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
# or set COMPOSE_FILE=docker-compose.yml:docker-compose.dev.yml once, which is what
# deploy.ps1, setup.ps1 and test-stack.ps1 do.
#
# BITBOB_IMAGE / BITBOB_EGRESS_IMAGE point somewhere else (a fork, a private mirror);
# BITBOB_TAG picks the version. See docs/CLIENTS.md "Phase 5".
#
#
# The agent's shell, files and tools run inside bitbob-agent as an unprivileged user.
# It can read and write only the data folder (mounted at /data). Its network is
# internal: no internet and no route to your home network or Windows. The only way
# out is the egress proxy, which allows just the domains in egress/allowlist.txt.
#
#   browser ──127.0.0.1:8787──▶ gateway ──▶ bitbob-agent ──▶ egress ──allowlist──▶ internet
#                                           (sandbox network, internal)

# A second, isolated copy can run alongside the live one: BITBOB_SUFFIX renames the containers,
# BITBOB_TAG its images, BITBOB_PORT its port and BITBOB_DATA_DIR its data. All default to the live
# stack's values, so nothing changes unless you set them. See scripts/bitbob-wsl/test-stack.ps1.

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  init: true
  restart: unless-stopped

services:
  bitbob-agent:
    <<: *hardening
    image: ${BITBOB_IMAGE:-ghcr.io/tommyhgunz14/bitbob}:${BITBOB_TAG:-latest}
    container_name: bitbob-agent${BITBOB_SUFFIX:-}
    env_file: .env
    environment:
      DATA_DIR: /data
      # Shown in the Files view so you can find the same folder on the host (inside the bitbob distro
      # on Windows). Set by deploy.ps1 / test-stack.ps1; empty in plain docker compose.
      BITBOB_HOST_DATA_DIR: ${BITBOB_HOST_DATA_DIR:-}
      HOST: 0.0.0.0
      # Bind mounts on Docker Desktop don't support SQLite's WAL shared memory reliably
      SQLITE_JOURNAL: DELETE
      # All outbound traffic via the allowlist proxy (Node, OpenCode, curl, git, npm, pip)
      HTTP_PROXY: http://egress:3128
      HTTPS_PROXY: http://egress:3128
      http_proxy: http://egress:3128
      https_proxy: http://egress:3128
      NO_PROXY: localhost,127.0.0.1,::1
      no_proxy: localhost,127.0.0.1,::1
      NODE_USE_ENV_PROXY: "1"
    volumes:
      - ${BITBOB_DATA_DIR:-./data}:/data
      # Folders you linked read-only (scripts/bitbob-wsl/link.ps1). Each one is already mounted
      # ro,noexec in the bitbob distro; :ro here again. Only you can add one, from Windows.
      - ${BITBOB_LINKS_DIR:-./links}:/links:ro
    networks: [sandbox]
    # Not just "egress exists": the agent's only route out is squid, and a container that is
    # running but not yet listening gives connect timeouts rather than a clean refusal, which
    # look like broken networking in the log. Wait until the proxy actually answers.
    depends_on:
      egress:
        condition: service_healthy
    tmpfs:
      - /tmp:size=1g
    pids_limit: 512
    mem_limit: ${BITBOB_MEMORY:-6g}
    cpus: ${BITBOB_CPUS:-4}

  egress:
    <<: *hardening
    image: ${BITBOB_EGRESS_IMAGE:-ghcr.io/tommyhgunz14/bitbob-egress}:${BITBOB_TAG:-latest}
    container_name: bitbob-egress${BITBOB_SUFFIX:-}
    volumes:
      - ./egress/allowlist.txt:/etc/squid/allowlist.txt:ro
    tmpfs:
      - /tmp
      - /var/spool/squid
      - /var/log/squid
      - /run
    networks: [sandbox, outside]
    pids_limit: 128
    mem_limit: 256m
    healthcheck:
      # connect and close: proves squid is accepting on 3128 without making a request it
      # would have to refuse (and log) every few seconds
      test: ["CMD", "socat", "-u", "OPEN:/dev/null", "TCP:127.0.0.1:3128"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  gateway:
    <<: *hardening
    image: ${BITBOB_EGRESS_IMAGE:-ghcr.io/tommyhgunz14/bitbob-egress}:${BITBOB_TAG:-latest}
    container_name: bitbob-gateway${BITBOB_SUFFIX:-}
    command: ["socat", "TCP-LISTEN:8787,fork,reuseaddr", "TCP:bitbob-agent:8787"]
    # Only reachable from this computer. Put a reverse proxy with HTTPS in front to expose it.
    ports:
      - "127.0.0.1:${BITBOB_PORT:-8787}:8787"
    networks: [sandbox, outside]
    # publishing the port before the server answers turns a slow start into a connection
    # error in the browser rather than a wait
    depends_on:
      egress:
        condition: service_healthy
      bitbob-agent:
        condition: service_healthy
    pids_limit: 128
    mem_limit: 128m

networks:
  # No internet, no host, no LAN: containers here can only talk to each other
  sandbox:
    internal: true
  outside: {}
