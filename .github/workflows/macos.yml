name: macos
# The BitBull desktop app for macOS: one universal .dmg (Apple Silicon and Intel, macOS 13+).
# Built on GitHub's macOS runners, so nobody needs a Mac to make it, only to test it.
#
# Unsigned for now: the first launch shows "can't be opened because Apple cannot check it";
# right-click the app → Open once. Signing and notarising need an Apple Developer ID
# (docs/CLIENTS.md, 5.5); add those secrets and a signing step here when there is one.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  dmg:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      # actions are pinned to commit SHAs (tag noted for humans; update both together)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Desktop app dependencies
        working-directory: desktop
        run: npm ci
      - name: Test the launcher's own code
        working-directory: desktop/src-tauri
        run: cargo test --locked
      - name: Build the universal app and .dmg
        working-directory: desktop
        run: npx tauri build --target universal-apple-darwin --bundles app,dmg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BitBull-macos
          path: desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
